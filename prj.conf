CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SENSOR=y

# Dual-CAN via MCP2515 over SPI
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80

# MCP2515 driver interrupt thread priority and filters
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=2
CONFIG_CAN_MCP2515_MAX_FILTERS=16

# Set system tick to 1kHz
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console on USART2 (ST-Link)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
