CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SENSOR=y

# Dual-CAN via MCP2515 over SPI
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80

# Set system tick to 1kHz to guarantee mathematically exact 1ms (1kHz) hardware timers
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console on USART2 (ST-Link), Command Parser on USART6
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y